# Welona Admin — nginx vhost for welona.vabinformatics.com
#
# Topology: single subdomain, path-routed.
#   /api/*  →  backend  (Next.js route handlers, port 3002)
#   /*      →  frontend (Next.js UI,            port 3001)
#
# Drop into /etc/nginx/sites-available/welona.vabinformatics.com and symlink
# into /etc/nginx/sites-enabled. Reload with `nginx -t && systemctl reload nginx`.
#
# TLS: certbot will edit this file in place to add the certificate paths
# after running:
#   certbot --nginx -d welona.vabinformatics.com
# Until then the http→https redirect block below sends every request to https.

# ---- HTTP → HTTPS redirect --------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name welona.vabinformatics.com;

    # ACME challenge for certbot — must be reachable over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS vhost ------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name welona.vabinformatics.com;

    # certbot will add:
    #   ssl_certificate     /etc/letsencrypt/live/welona.vabinformatics.com/fullchain.pem;
    #   ssl_certificate_key /etc/letsencrypt/live/welona.vabinformatics.com/privkey.pem;
    #   include /etc/letsencrypt/options-ssl-nginx.conf;
    #   ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # File-upload ceiling — Next.js form posts and bulk imports.
    client_max_body_size 25M;

    # ---- Backend API (path-routed) ----
    # Anything under /api goes to the backend. Trailing slash matters: with
    # `proxy_pass http://127.0.0.1:3002;` (no trailing slash) nginx keeps the
    # /api prefix intact, which is what Next.js route handlers expect.
    location /api/ {
        proxy_pass         http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ---- Frontend (Next.js UI) ----
    # _next/* and everything else.
    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
