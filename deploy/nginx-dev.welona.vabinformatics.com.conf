# Welona Admin — nginx vhost for dev.welona.vabinformatics.com
#
# Topology: single subdomain, path-routed.
#   /api/*  →  backend  (Next.js route handlers, port 3602)
#   /*      →  frontend (Next.js UI,            port 3601)
#
# Drop into /etc/nginx/sites-available/welona-dev and symlink into
# /etc/nginx/sites-enabled. Reload with `nginx -t && systemctl reload nginx`.
#
# TLS: certbot --nginx -d dev.welona.vabinformatics.com

# ---- HTTP → HTTPS redirect --------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name dev.welona.vabinformatics.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS vhost ------------------------------------------------------------
server {
    listen 443 ssl;
    server_name dev.welona.vabinformatics.com;

    # certbot will add ssl_certificate lines here
    # ssl_certificate     /etc/letsencrypt/live/dev.welona.vabinformatics.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/dev.welona.vabinformatics.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 25M;

    # ---- Backend API ----
    location /api/ {
        proxy_pass         http://127.0.0.1:3602;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ---- Frontend (Next.js UI) ----
    location / {
        proxy_pass         http://127.0.0.1:3601;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
