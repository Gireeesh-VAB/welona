name: Deploy — Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm production deployment'
        required: true
        default: ''

jobs:
  check-branch:
    name: Verify branch is production
    runs-on: ubuntu-latest
    steps:
      - name: Enforce production branch
        if: github.ref != 'refs/heads/production'
        run: |
          echo "ERROR: This workflow must be run from the 'production' branch."
          echo "Current ref: ${{ github.ref }}"
          exit 1

      - name: Verify confirmation input
        if: github.event.inputs.confirm != 'deploy'
        run: |
          echo "ERROR: Type 'deploy' in the confirm field to proceed."
          exit 1

  deploy:
    name: Build & Deploy to welona.vabinformatics.com
    runs-on: ubuntu-latest
    needs: check-branch
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install shared dependencies
        working-directory: shared
        run: npm install --legacy-peer-deps

      - name: Build frontend (production)
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://welona.vabinformatics.com/api/v1
          NEXT_PUBLIC_WS_URL: https://welona.vabinformatics.com
          NEXT_PUBLIC_APP_NAME: Welona Admin
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Sync shared package
        run: |
          rsync -az --exclude='node_modules' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./shared/ \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/var/www/html/welona-prod/shared/

      - name: Sync backend source
        run: |
          rsync -az \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='*.db' \
            --exclude='*.db-journal' \
            --exclude='.env' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./backend/ \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/var/www/html/welona-prod/backend/

      - name: Sync frontend build
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./frontend/.next/ \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/var/www/html/welona-prod/frontend/.next/

          rsync -az \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='.env*' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./frontend/src \
            ./frontend/public \
            ./frontend/next.config.mjs \
            ./frontend/package.json \
            ./frontend/package-lock.json \
            ./frontend/tailwind.config.ts \
            ./frontend/postcss.config.js \
            ./frontend/tsconfig.json \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/var/www/html/welona-prod/frontend/

      - name: Install dependencies, migrate DB, build & restart (prod)
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'ENDSSH'
            set -e

            echo "── Installing shared deps ──"
            cd /var/www/html/welona-prod/shared
            npm install --legacy-peer-deps

            echo "── Installing backend deps ──"
            cd /var/www/html/welona-prod/backend
            npm install --legacy-peer-deps

            echo "── Pushing database schema ──"
            npx prisma db push --accept-data-loss

            echo "── Building backend ──"
            npm run build

            echo "── Installing frontend deps ──"
            cd /var/www/html/welona-prod/frontend
            npm install --legacy-peer-deps

            echo "── Starting/Restarting PM2 processes ──"
            pm2 describe welona-prod-backend > /dev/null 2>&1 \
              && PORT=3702 pm2 restart welona-prod-backend --update-env \
              || PORT=3702 pm2 start "npm start" --name welona-prod-backend --cwd /var/www/html/welona-prod/backend

            pm2 describe welona-prod-frontend > /dev/null 2>&1 \
              && PORT=3701 pm2 restart welona-prod-frontend --update-env \
              || PORT=3701 pm2 start "npm start" --name welona-prod-frontend --cwd /var/www/html/welona-prod/frontend

            pm2 save

            echo "── Deploy complete ──"
          ENDSSH
