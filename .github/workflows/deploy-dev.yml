name: Deploy — Development

on:
  push:
    branches:
      - development

jobs:
  deploy:
    name: Build & Deploy to dev.welona.vabinformatics.com
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend (dev)
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://dev.welona.vabinformatics.com/api/v1
          NEXT_PUBLIC_WS_URL: https://dev.welona.vabinformatics.com
          NEXT_PUBLIC_APP_NAME: Welona Admin (Dev)
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Sync shared package
        run: |
          rsync -az --exclude='node_modules' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./shared/ \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/var/www/html/welona-dev/shared/

      - name: Sync backend source
        run: |
          rsync -az \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='*.db' \
            --exclude='*.db-journal' \
            --exclude='.env' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./backend/ \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/var/www/html/welona-dev/backend/

      - name: Sync frontend build
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./frontend/.next/ \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/var/www/html/welona-dev/frontend/.next/

          rsync -az \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='.env*' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./frontend/src \
            ./frontend/public \
            ./frontend/next.config.mjs \
            ./frontend/package.json \
            ./frontend/package-lock.json \
            ./frontend/tailwind.config.ts \
            ./frontend/postcss.config.js \
            ./frontend/tsconfig.json \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/var/www/html/welona-dev/frontend/

      - name: Install dependencies, migrate DB, build & restart (dev)
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'ENDSSH'
            set -e

            echo "── Installing shared deps ──"
            cd /var/www/html/welona-dev/shared
            npm install --legacy-peer-deps

            echo "── Installing backend deps ──"
            cd /var/www/html/welona-dev/backend
            npm install --legacy-peer-deps

            echo "── Running database migrations ──"
            npx prisma migrate deploy

            echo "── Building backend ──"
            npm run build

            echo "── Installing frontend deps ──"
            cd /var/www/html/welona-dev/frontend
            npm install --legacy-peer-deps

            echo "── Restarting PM2 processes ──"
            pm2 restart welona-dev-backend welona-dev-frontend
            pm2 save

            echo "── Deploy complete ──"
          ENDSSH
