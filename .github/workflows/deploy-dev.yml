name: Deploy — Development

on:
  push:
    branches:
      - main
      - development
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to dev.welona.vabinformatics.com
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install shared dependencies
        working-directory: shared
        run: npm install --legacy-peer-deps

      - name: Build frontend (dev)
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://dev.welona.vabinformatics.com/api/v1
          NEXT_PUBLIC_WS_URL: https://dev.welona.vabinformatics.com
          NEXT_PUBLIC_APP_NAME: Welona Admin (Dev)
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Sync shared package
        run: |
          rsync -az --exclude='node_modules' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./shared/ \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/var/www/html/welona-dev/shared/

      - name: Sync backend source
        run: |
          rsync -az \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='*.db-journal' \
            --exclude='.env' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./backend/ \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/var/www/html/welona-dev/backend/

      - name: Sync frontend build
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./frontend/.next/ \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/var/www/html/welona-dev/frontend/.next/

          rsync -az \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='.env*' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./frontend/src \
            ./frontend/public \
            ./frontend/next.config.mjs \
            ./frontend/package.json \
            ./frontend/package-lock.json \
            ./frontend/tailwind.config.ts \
            ./frontend/postcss.config.js \
            ./frontend/tsconfig.json \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/var/www/html/welona-dev/frontend/

      - name: Write backend .env on server
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} bash << 'ENVSSH'
            set -e
            ENV_FILE=/var/www/html/welona-dev/backend/.env

            # Ensure the file exists
            touch "$ENV_FILE"

            # Write or update DATABASE_URL
            if grep -q "^DATABASE_URL=" "$ENV_FILE"; then
              sed -i 's|^DATABASE_URL=.*|DATABASE_URL=file:./prisma/dev.db|' "$ENV_FILE"
            else
              echo "DATABASE_URL=file:./prisma/dev.db" >> "$ENV_FILE"
            fi

            echo "DATABASE_URL set: $(grep DATABASE_URL $ENV_FILE)"
          ENVSSH

      - name: Install dependencies, migrate DB, build & restart (dev)
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'ENDSSH'
            set -e

            echo "── Installing shared deps ──"
            cd /var/www/html/welona-dev/shared
            npm install --legacy-peer-deps

            echo "── Installing backend deps ──"
            cd /var/www/html/welona-dev/backend
            npm install --legacy-peer-deps

            echo "── Pushing database schema ──"
            npx prisma db push --accept-data-loss

            echo "── Seeding database (only if empty) ──"
            ROW_COUNT=$(node -e "
              const { PrismaClient } = require('@prisma/client');
              const db = new PrismaClient();
              db.organization.count().then(n => { console.log(n); db.\$disconnect(); }).catch(() => { console.log(0); });
            " 2>/dev/null || echo "0")
            echo "Organization row count: $ROW_COUNT"
            if [ "$ROW_COUNT" = "0" ]; then
              echo "Empty DB — seeding..."
              npm run db:seed-all
            else
              echo "DB has data — skipping seed"
            fi

            echo "── Building backend ──"
            npm run build

            echo "── Installing frontend deps ──"
            cd /var/www/html/welona-dev/frontend
            npm install --legacy-peer-deps

            echo "── Starting/Restarting PM2 processes ──"
            pm2 describe welona-dev-backend > /dev/null 2>&1 \
              && PORT=3602 pm2 restart welona-dev-backend --update-env \
              || PORT=3602 pm2 start "npm start" --name welona-dev-backend --cwd /var/www/html/welona-dev/backend

            pm2 describe welona-dev-frontend > /dev/null 2>&1 \
              && PORT=3601 pm2 restart welona-dev-frontend --update-env \
              || PORT=3601 pm2 start "npm start" --name welona-dev-frontend --cwd /var/www/html/welona-dev/frontend

            pm2 save

            echo "── Deploy complete ──"
          ENDSSH
